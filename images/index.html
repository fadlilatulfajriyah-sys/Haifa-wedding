<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Harun & Fadila — HAIFA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family: Georgia, "Times New Roman", serif;
  background:#f7efe3;
}
.cover{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(rgba(247,239,227,.08),rgba(247,239,227,.08)),
    url("background-cover.png") center center/cover no-repeat;
}

/* Lapisan cahaya lembut */
.cover::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,250,235,.45), transparent 34%),
    linear-gradient(to bottom, rgba(255,255,255,.05), rgba(92,39,25,.08));
  animation:glow 5s ease-in-out infinite alternate;
}

.content{
  position:absolute;
  z-index:5;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10vh 10vw 13vh;
  color:#6b251d;
}

.small{
  font-size:clamp(11px,2.8vw,15px);
  letter-spacing:.28em;
  text-transform:uppercase;
  opacity:0;
  animation:fadeUp 1.2s .7s forwards;
}

.haifa{
  margin:.35em 0 .1em;
  font-size:clamp(54px,17vw,105px);
  line-height:.9;
  letter-spacing:.08em;
  font-weight:500;
  color:#7b281f;
  text-shadow:0 2px 10px rgba(113,66,35,.12);
  opacity:0;
  animation:haifaIn 1.5s 1.15s forwards;
}

.names{
  font-size:clamp(19px,5vw,30px);
  letter-spacing:.12em;
  color:#9b6d2e;
  opacity:0;
  animation:fadeUp 1.2s 1.8s forwards;
}

.amp{
  color:#7b281f;
  padding:0 .12em;
}

.tagline{
  margin-top:1em;
  max-width:290px;
  font-size:clamp(12px,3.1vw,17px);
  line-height:1.55;
  font-style:italic;
  color:#8d693b;
  opacity:0;
  animation:fadeUp 1.2s 2.3s forwards;
}

.divider{
  width:90px;
  height:1px;
  margin:1.2em 0 .2em;
  background:#b88a48;
  transform:scaleX(0);
  animation:lineIn 1s 2.1s forwards;
}

.petal{
  position:absolute;
  z-index:3;
  width:9px;
  height:14px;
  border-radius:100% 0 100% 0;
  background:rgba(255,245,224,.78);
  filter:blur(.2px);
  opacity:0;
  pointer-events:none;
  animation:fall linear infinite;
}

.p1{left:18%;top:-20px;animation-duration:8s;animation-delay:2s}
.p2{left:39%;top:-40px;animation-duration:10s;animation-delay:4s}
.p3{left:67%;top:-30px;animation-duration:9s;animation-delay:1s}
.p4{left:82%;top:-50px;animation-duration:11s;animation-delay:5s}
.p5{left:53%;top:-70px;animation-duration:7.5s;animation-delay:6s}

.lantern-glow{
  position:absolute;
  z-index:2;
  width:18vw;
  height:18vw;
  max-width:90px;
  max-height:90px;
  border-radius:50%;
  background:rgba(255,216,126,.12);
  filter:blur(14px);
  animation:lantern 3s ease-in-out infinite;
}
.lg1{left:7%;top:25%}
.lg2{right:8%;top:18%;animation-delay:1.2s}

.open{
  position:absolute;
  z-index:6;
  bottom:5.5vh;
  left:50%;
  transform:translateX(-50%);
  border:1px solid rgba(145,103,45,.65);
  background:rgba(255,249,236,.78);
  color:#6f2b22;
  padding:12px 27px;
  border-radius:999px;
  font-family:inherit;
  font-size:14px;
  letter-spacing:.12em;
  box-shadow:0 6px 25px rgba(74,39,20,.12);
  backdrop-filter:blur(6px);
  cursor:pointer;
  opacity:0;
  animation:fadeUp 1.2s 3s forwards, breathe 2.8s 4.5s infinite;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes haifaIn{
  from{opacity:0;transform:scale(.88);letter-spacing:.2em}
  to{opacity:1;transform:scale(1);letter-spacing:.08em}
}
@keyframes lineIn{to{transform:scaleX(1)}}
@keyframes glow{
  from{opacity:.7}
  to{opacity:1}
}
@keyframes lantern{
  0%,100%{transform:scale(.8);opacity:.35}
  50%{transform:scale(1.25);opacity:.8}
}
@keyframes breathe{
  0%,100%{box-shadow:0 6px 25px rgba(74,39,20,.12)}
  50%{box-shadow:0 6px 32px rgba(184,138,72,.3)}
}
@keyframes fall{
  0%{opacity:0;transform:translate3d(0,-5vh,0) rotate(0)}
  10%{opacity:.8}
  100%{opacity:0;transform:translate3d(13vw,108vh,0) rotate(420deg)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<section class="cover">
  <div class="lantern-glow lg1"></div>
  <div class="lantern-glow lg2"></div>

  <span class="petal p1"></span>
  <span class="petal p2"></span>
  <span class="petal p3"></span>
  <span class="petal p4"></span>
  <span class="petal p5"></span>

  <div class="content">
    <div class="small">The Wedding of</div>
    <div class="haifa">HAIFA</div>
    <div class="names">HARUN <span class="amp">&amp;</span> FADILA</div>
    <div class="divider"></div>
    <div class="tagline">Together in Two Cultures,<br>One Forever</div>
  </div>

  <button class="open" onclick="openInvitation()">Buka Undangan</button>
</section>

<script>
function openInvitation(){
  // Ganti bagian ini dengan halaman utama undanganmu.
  // Contoh: window.location.href = "undangan.html";
  alert("Cover berhasil dibuat. Hubungkan tombol ini ke halaman utama undangan.");
}
</script>
</body>
</html>
